# Local development infrastructure for Tracktist.
# Postgres ships with the PostGIS extension pre-installed so `CREATE EXTENSION
# postgis` works out of the box (see apps/web/prisma migrations).
services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: tracktist-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: tracktist
    ports:
      - "5432:5432"
    volumes:
      - tracktist-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d tracktist"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: tracktist-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - tracktist-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tracktist-pg:
  tracktist-redis:
