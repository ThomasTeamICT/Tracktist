# Tracktist CI — the same gates that are run locally:
# typecheck ×3, 65 core unit tests, Spike 0 (offline data proof),
# the 30-assertion integration test against real PostGIS, and a
# production build of the web app.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Typecheck + core tests + Spike 0
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # reads the pinned version from packageManager
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The web app's types come from the GENERATED Prisma client — without
      # this, @prisma/client is an empty stub and the typecheck fails.
      - run: pnpm --filter @tracktist/web prisma generate
      - run: pnpm -r --if-present typecheck
      - run: pnpm --filter @tracktist/core test
      - run: pnpm --filter @tracktist/core spike0

  web:
    name: PostGIS integration + production build
    runs-on: ubuntu-latest
    needs: core
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: tracktist
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d tracktist"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://user:password@localhost:5432/tracktist
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tracktist/web prisma generate
      - run: pnpm --filter @tracktist/web prisma migrate deploy
      - run: pnpm --filter @tracktist/web test:integration
      - run: pnpm --filter @tracktist/web build
